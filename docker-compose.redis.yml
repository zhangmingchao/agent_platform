services:
  redis:
    # LangGraph 官方 Redis Checkpointer 需要 RedisJSON 与 RediSearch。
    image: redis/redis-stack-server:latest
    container_name: agent-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 使用 REDIS_ARGS 传递持久化参数，保留 Redis Stack 默认的模块加载流程。
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - agent-platform-redis-data:/data

volumes:
  agent-platform-redis-data:
